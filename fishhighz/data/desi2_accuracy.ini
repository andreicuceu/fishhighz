[schema]
name = fishhighz-native-survey
version = 1

[prescription]
name = accuracy

# Optional [numerical], [model] and [input policies] sections override
# supported accuracy settings; saved metadata records all effective values.
[cosmology]
camb_ini = package:camb_configs/Planck18.ini
template = package:templates/Planck18_z_2.406.fits
template_redshift = 2.406
damping_reference_redshift = 2.3

[survey]
area_deg2 = 5000.0
min_band_mag = 16.1
max_band_mag = 26.75
z_edges = 2.0, 2.235, 2.47, 2.705, 2.94, 3.175, 3.41
resolution = 2500
reconstruction_factor = 2.0

[fields]
ids = lya(qso), qso, lbg, lae, lya(lbg)

[field lya(qso)]
kind = forest
physical_model = lya
background = qso
tracer = lya
density = package:dn_dzdr_qso_desi_2.dat
target_density = 90
z_norm_min = 2.15
density_magnitude_bounds = survey
snr = package:DESI-2-QSO
num_exposures = 4
pix_width_angstrom = 0.8
min_rest_frame_lya = 1040
max_rest_frame_lya = 1205

[field qso]
kind = galaxy
physical_model = qso
tracer = qso
density = package:dn_dzdr_qso_desi_2.dat
target_density = 90
z_norm_min = 2.15
density_magnitude_bounds = none

[field lbg]
kind = galaxy
physical_model = lbg
tracer = lbg
density = package:lbg_matched_dndzdr.txt
target_density = 380.0
density_magnitude_bounds = none
bias_z = 2.0, 4.0
bias_values = 3.3, 3.3

[field lae]
kind = galaxy
physical_model = lae
tracer = lae
density = package:lae_matched_dndzdr.txt
target_density = 430.00000000000006
density_magnitude_bounds = none
bias_z = 2.5, 3.0
bias_values = 1.76, 2.42

[field lya(lbg)]
kind = forest
physical_model = lya
background = lbg
tracer = lya
density = package:lbg_matched_dndzdr.txt
target_density = 380.0
z_norm_min = 2.15
density_magnitude_bounds = survey
snr = package:DESI-2-LBG
num_exposures = 4
pix_width_angstrom = 0.8
min_rest_frame_lya = 1040
max_rest_frame_lya = 1205

[pairs bin 1]
selected = lya(qso)xlya(qso), lya(qso)xqso, qsoxqso

[pairs bin 2]
selected = all

[pairs bin 3]
selected = all

[pairs bin 4]
selected = all

[pairs bin 5]
selected = all

[pairs bin 6]
selected = all

