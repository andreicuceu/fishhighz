# FishHighz native INI: complete annotated DESI Run-2 accuracy example.
# All active scientific settings equal the bundled desi2_accuracy.ini.
# This is deliberately verbose; the bundled file demonstrates minimal usage.
#
# Run from the FishHighz repository with the optional forecast dependencies:
#   python -m pip install -e '.[templates,cosmology,camb,survey]'
#   fishhighz-forecast examples/desi2_accuracy_annotated.ini --output my-forecast
# Equivalently:
#   python -m fishhighz.cli examples/desi2_accuracy_annotated.ini --output my-forecast
# Python:
#   from fishhighz import Forecast
#   result = Forecast("examples/desi2_accuracy_annotated.ini").run()
#   result.save("my-forecast")
# Supply an absolute INI pathname when running from another directory. The
# package: inputs below do not depend on the working directory. Existing output
# directories are not overwritten. There is no [output] INI section.
#
# Syntax: use full-line comments, not trailing comments after values. Sections
# and string values are case sensitive; option names are case insensitive.
# Unknown sections/options, duplicate definitions and [DEFAULT] values are
# rejected. No legacy lyaforecast INI translation or environment-variable
# interpolation is performed. Lists use commas or whitespace except where
# noted (parameter_names and selected pairs). This native interface supports
# the BAO accuracy calculation below; broader Python API capabilities are not
# automatically INI options. In particular batch_size, step_scale and numerical
# are Forecast.run() arguments, not INI keys.
#
# Required/default convention used below:
# * [schema], [cosmology], [survey], [fields], each listed [field ID], and every
#   [pairs bin N] must be supplied; [prescription] is optional.
# * With [prescription] name=accuracy, [model], [input policies], [numerical]
#   and their keys may be omitted. Their defaults are exactly the values shown.
#   Three survey defaults and derived num_z_bins are identified below.
# * Without [prescription], every key shown in [model], [input policies],
#   [numerical], [cosmology] and [survey] is required, subject to the tolerance
#   alias rule below. Field options have their own explicit requirements.
# * Explicit values override prescription defaults, but fixed-only strings
#   cannot select another implementation. The named revision records the
#   prescription; saved metadata also records all effective overridden values.

[schema]
# Both required. Only this schema name and integer version are supported.
name = fishhighz-native-survey
version = 1

[prescription]
# Optional section. If present, name is required; only accuracy is supported.
name = accuracy
# Optional; defaults to this revision. Other revision strings are rejected.
revision = early-lyaforecast-2026-09-18

[cosmology]
# All four keys are required, even with the prescription.
# package: paths refer to installed fishhighz/data assets. Alternatively use
# an absolute path, or a path relative to this INI's directory (not the cwd).
# Example replacement: camb_ini = ../my_data/my_cosmology.ini
# Paths beginning with ~ are expanded. No URL/download syntax is supported.
camb_ini = package:camb_configs/Planck18.ini
# Vega-format FITS with columns K [h/Mpc], PK and PKSB [(Mpc/h)^3].
# PKSB is the smooth component; signed wiggles are PK-PKSB. FishHighz does
# not regenerate this decomposition. Supply a template consistent with CAMB,
# its h and the declared normalization redshift, with sufficient k support
# for AP-displaced model evaluations beyond the fixed observed-coordinate cuts.
template = package:templates/Planck18_z_2.406.fits
# Nonnegative redshift at which the input template is normalized (0 allowed).
# Its power is multiplied by [sigma8(z_eval)/sigma8(template_redshift)]^2.
# Changing this number alone does not regenerate the template.
template_redshift = 2.406
# Separate nonnegative normalization redshift for BAO damping widths (0 allowed).
# This does not set the template growth normalization or the bin redshifts.
damping_reference_redshift = 2.3

[survey]
# Required positive area in deg^2, at most full sky (41252.96124941927 deg^2).
# A common integrated comoving volume is used for all fields in each bin.
area_deg2 = 5000.0
# Default r with the prescription; only r is accepted by this INI interface.
band = r
# Required finite ordered r-magnitude bounds. All fields share this integration
# interval. Density normalization bounds are a separate field-level choice.
min_band_mag = 16.1
max_band_mag = 26.75
# Required strictly increasing redshift edges, num_z_bins+1 entries. Use
# nonnegative redshifts consistent with cosmology and survey input support.
# Each bin has its own ap/at parameters; bins are statistically independent.
z_edges = 2.0, 2.235, 2.47, 2.705, 2.94, 3.175, 3.41
# Positive integer. With accuracy this is inferred from z_edges if omitted.
num_z_bins = 6
# Required positive dimensionless R=lambda/FWHM_lambda, applied to forests.
# Gaussian sigma_v=c/[R*sqrt(8*ln(2))]; galaxy response is identity.
resolution = 2500
# Required positive galaxy reconstruction factor, dividing damping WIDTH by
# sqrt(factor), not factor. Forests use [model] forest_reconstruction_factor.
reconstruction_factor = 2.0
# Default below with prescription: positive Ly-alpha rest wavelength [Angstrom].
# Observed wavelength = lya_rest_angstrom*(1+z_eval).
lya_rest_angstrom = 1215.67
# Default below, fixed-only: z_eval=sqrt[(1+z_min)*(1+z_max)]-1.
# Density, bias and signal use this representative redshift; the volume uses
# redshift quadrature. Forest background-source redshifts differ (see fields).
evaluation_redshift = geometric_1plusz

[fields]
# Required ordered unique observed-field IDs, comma/space separated. IDs identify
# samples, not merely physical tracers. Avoid commas, whitespace or lowercase x
# inside an ID: those characters delimit lists/pairs. Every ID needs [field ID].
# Shared physical_model labels do not merge fields, weights, noise or biases.
ids = lya(qso), qso, lbg, lae, lya(lbg)

# Field options are documented fully here and apply to every [field ID].
[field lya(qso)]
# Required kind: forest or galaxy. Forest factors are b*(1+beta*mu^2);
# galaxy factors are b+f*mu^2, with f from CAMB at the bin redshift.
kind = forest
# Required nonempty descriptive physical label; does not choose a plugin/model.
physical_model = lya
# Required nonempty background-source label for forests; forbidden for galaxies.
# This records identity, not a link that inherits settings from [field qso].
background = qso
# Always required. Selects analytic bias only when no bias table is supplied;
# tabulated bias bypasses this selector. Supported analytic tracer values:
# lya, qso, elgqso, lbg, lae. Analytic b(z)=b_ref*((1+z)/(1+z_ref))^alpha:
# lya: (-0.1352, 2.33, 2.9); qso/elgqso: (3.54, 2.33, 1.44);
# lbg: (3.48, 2.9, 1.44); lae: (2.2, 2.9, 1.44).
# Here each tuple is (b_ref, z_ref, alpha). A supplied bias_z/bias_values pair
# replaces b(z), but does not replace forest_beta or the galaxy growth rate.
tracer = lya
# Required density file: three whitespace-separated columns (source z, r mag,
# nonnegative cell count per deg^2), a complete rectangular grid with >=3 nodes
# on each axis, no duplicate/missing cells, uniformly spaced magnitudes.
# Raw counts are per redshift/magnitude CELL, not dN/dz/dm; the fixed width
# policy below converts them. All values must be finite; source z >=0.
density = package:dn_dzdr_qso_desi_2.dat
# Required positive target surface density [deg^-2] over the normalization
# domain below; not the comoving density and not necessarily the density
# integrated over the forecast bins. Scale the entire masked raw distribution
# by target_density/sum(counts in normalization domain).
target_density = 90
# Optional nonnegative threshold; only raw rows with z > z_norm_min contribute
# to the normalization sum (strict inequality). Omit to use all raw redshifts.
# It does not remove lower-redshift rows from the resulting distribution.
z_norm_min = 2.15
# Required: survey or none. survey zeroes raw magnitude cells outside inclusive
# survey bounds before normalization/interpolation; none keeps all raw cells.
# Neither changes the common [survey] magnitude INTEGRATION interval.
density_magnitude_bounds = survey
# Optional field-local aliases; if supplied must equal survey bounds exactly.
# They do not permit a separate per-field sample selection, under either policy.
# min_band_mag = 16.1
# max_band_mag = 26.75
# The next five keys are REQUIRED for forests and not used for galaxy physics.
# Directory of SNR tables, one per magnitude. External directories read *.dat;
# package: directories read every bundled file, so contain only SNR tables.
# Each file has comment metadata BAND=r, MAG=<m>, EXPTIME=<seconds>, NEXP=<n>,
# and a comment header: Wave SN(z=2.0) SN(z=2.5) ...
# Data columns: observed wavelength [Angstrom], SNR per Angstrom for each z.
# Use increasing wavelengths/source-z axes and nonnegative finite SNR; files
# must have matching grids, BAND, EXPTIME and NEXP, and unique magnitudes.
# SNR redshifts are BACKGROUND-source redshifts, not absorption-bin redshifts.
snr = package:DESI-2-QSO
# Positive effective exposure count (not required to be integral). SNR scales
# by sqrt(num_exposures/header NEXP), at fixed header EXPTIME per exposure.
# Exposure duration has no INI override.
num_exposures = 4
# Positive FULL pixel width [Angstrom], not sigma or FWHM. Also multiplies
# per-Angstrom SNR by sqrt(pixel width). Response uses Delta_v=c*width/lambda.
pix_width_angstrom = 0.8
# Positive ordered rest-frame forest wavelength bounds [Angstrom]. They set
# forest length c*ln(max/min) [km/s] and representative background redshift
# z_source=lambda_obs/sqrt(min*max)-1 used to sample source density and SNR.
min_rest_frame_lya = 1040
max_rest_frame_lya = 1205
# Optional tabulated bias alternative: supply BOTH lists or neither. Each needs
# >=2 finite entries; z values must be nonnegative and strictly increasing;
# lengths must match. Linear interpolation and endpoint-slope extrapolation
# are used, including outside the supplied z range; no clipping is performed.
# Bias values are dimensionless and may be negative (as for Ly-alpha).
# Example replacement of analytic forest bias (changes this forecast):
# bias_z = 2.0, 3.5
# bias_values = -0.10, -0.30

[field qso]
# Galaxies need kind, physical_model, tracer, density, target_density and
# density_magnitude_bounds. Omit background, SNR and forest instrument keys.
kind = galaxy
physical_model = qso
tracer = qso
density = package:dn_dzdr_qso_desi_2.dat
target_density = 90
z_norm_min = 2.15
density_magnitude_bounds = none
# bias_z/bias_values omitted: analytic QSO bias above.

[field lbg]
kind = galaxy
physical_model = lbg
tracer = lbg
density = package:lbg_matched_dndzdr.txt
target_density = 380.0
# z_norm_min omitted: normalize over all raw redshift rows.
density_magnitude_bounds = none
# Constant tabulated b(z), including its linear (zero-slope) extrapolation.
bias_z = 2.0, 4.0
bias_values = 3.3, 3.3

[field lae]
kind = galaxy
physical_model = lae
tracer = lae
density = package:lae_matched_dndzdr.txt
# Preserve the literal baseline target density.
target_density = 430.00000000000006
density_magnitude_bounds = none
# Values outside 2.5 <= z <= 3.0 are linearly extrapolated, not held constant.
bias_z = 2.5, 3.0
bias_values = 1.76, 2.42

[field lya(lbg)]
# A separate observed forest with Ly-alpha physics but LBG source density/SNR.
kind = forest
physical_model = lya
background = lbg
tracer = lya
density = package:lbg_matched_dndzdr.txt
target_density = 380.0
z_norm_min = 2.15
density_magnitude_bounds = survey
snr = package:DESI-2-LBG
num_exposures = 4
pix_width_angstrom = 0.8
min_rest_frame_lya = 1040
max_rest_frame_lya = 1205

[model]
# Every value below is the accuracy default; the entire section is optional
# with that prescription. Without it all keys are required.
# Fixed-only parameter basis and comma-separated local parameter names.
# ap/at are parallel/transverse wiggle dilation parameters, fiducials 1.
# Alternate bases supported by the low-level Python model are not INI options.
parameterization = ap_at
parameter_names = ap, at
# Fixed-only: smooth spectrum unchanged by ap/at; wiggle coordinates and AP
# Jacobian are varied, including the mapped angular Kaiser/damping dependence.
smooth_scaling = identity
wiggle_scaling = ap_at
# Fixed-only wiggle damping: pair Sigma_parallel/perp^2 is the arithmetic mean
# of the corresponding two auto widths squared, also for forest-galaxy pairs.
# The Gaussian factor is exp[-k^2*(mu^2*Sigma_parallel^2+
# (1-mu^2)*Sigma_perp^2)/2]. Widths are held fixed in parameter derivatives.
damping = mixed_squared_width
# Fixed-only template growth ratio described under template_redshift.
growth = camb_sigma8_ratio
# Fixed-only: galaxy and forest reconstruction factors are separate.
reconstruction = per_field
# Positive dimensionless beta for all forest fields (default 1.45).
forest_beta = 1.45
# Positive Sigma_perp amplitude [Mpc/h], default 3.26, at the damping reference
# redshift before reconstruction. Sigma_perp = amplitude*sigma8(z_eval)/
# sigma8(z_damping_ref)/sqrt(reconstruction factor);
# Sigma_parallel=(1+f(z_eval))*Sigma_perp.
damping_amplitude = 3.26
# Positive dimensionless forest factor, default 1.0. Larger values narrow
# forest damping widths. Does not change the galaxy factor in [survey].
forest_reconstruction_factor = 1.0

[input policies]
# All entries default to the values below with accuracy. Except for the two
# reference coordinates and stopping controls, these are fixed-only policy
# declarations: other strings/numbers are rejected, even if a lower-level
# Python reader supports them. They document the retained input prescription.
# Counts per deg^2 are converted to dN/(dz dm deg^2) after normalization.
density_semantics = cell_count_per_deg2
# Divide every raw row by the FIRST sorted z spacing, even for irregular z.
# This is a compatibility convention, not inferred physical cell widths.
density_width_policy = legacy_first_spacing
# Scale to each field's target_density over its stated normalization domain.
density_redshift_normalization = target_density
# Replace negative interpolated density by 1e-20; retain zero and positive
# values below that floor. Out-of-table magnitudes also receive 1e-20;
# out-of-table redshift queries use the legacy spline boundary extension.
density_negative_policy = floor_negative
# Exact quadratic tensor spline, kx=ky=2 and smoothing s=0.
density_interpolation = RectBivariateSpline_kx2_ky2_s0
# Gaussian SNR smoothing along wavelength: sigma=10 SAMPLE INDICES, reflect
# boundary mode, truncate=4. This is not an Angstrom or velocity sigma.
snr_smoothing = legacy
# Linear interpolation in magnitude, source redshift and observed wavelength.
snr_interpolation = linear_RegularGridInterpolator
# Brighter-than-table queries use the brightest tabulated magnitude.
snr_bright_policy = clamp_to_brightest_tabulated_magnitude
# Fixed floor on scaled per-pixel SNR; variance=1/max(SNR,clamp)^2.
snr_clamp = 1e-10
# Fixed VARIANCE for too-faint magnitudes or out-of-domain source redshift/
# observed wavelength. This sentinel is independent of exposure scaling.
snr_sentinel = 1e20
# Split the common magnitude interval at density spline knots/support edges,
# SNR magnitude nodes and negative-density roots before Gauss-Legendre sampling.
magnitude_partition = density_knots_support_snr_nodes_negative_roots
# Fixed-only full-sample historical forest-weight recurrence; no prefix recurrence,
# fixed-count or McDonald selector is exposed by the native INI interface.
weighting_method = early_lyaforecast
# Fixed-only: per-field fiducial AUTO P3D and intrinsic P1D are evaluated at the
# representative mode, with each field's instrumental response squared.
# The default P1D prescription is built in; no P1D file/model selector exists.
# Weights remain frozen during BAO derivatives, not recomputed for shifted AP.
weighting_reference = fiducial_auto_p3d_and_p1d_times_response_squared
# Positive transverse angular wavenumber [deg^-1], default 2.4. This sets
# the weighting representative mode, not a cut on the Fisher integration.
weighting_reference_k_t_deg = 2.4
# Positive parallel velocity wavenumber [s/km], default 0.00035.
weighting_reference_k_p_velocity = 0.00035
# Positive dimensionless iteration tolerance, default 1e-5. Alias of numerical
# weight_rtol: specifying only one updates both; if both are explicit they must
# agree numerically. Neither is a Fisher-error or quadrature tolerance.
weighting_rtol = 1e-5
# Positive integer minimum updates before nominating a convergence candidate.
weighting_min_updates = 3
# Positive integer required consecutive stable transitions. Residuals compare
# weight amplitude, normalized shape, full vector, aliasing coefficient A and
# pixel-noise power P_pixel; all must satisfy the relative tolerance.
weighting_stable_steps = 3
# Positive cap >= min_updates. Candidate comparisons and intervening transitions
# must remain within rtol through twice the candidate count. Returning a capped
# sequence is not convergence: native preparation raises on unconverged weights.
# These checks test recurrence convergence, not magnitude-grid convergence.
weighting_max_updates = 96
# Fixed-only independent diagonal sampling noise: no supplied overlap/cross-noise
# INI option. This does NOT discard covariance between selected spectra.
sampling_noise = independent_diagonal

[numerical]
# Entire section optional with accuracy; values shown are all its defaults.
# All quadrature counts are positive integers; refinement changes the numerical
# calculation and should be assessed separately from iteration convergence.
# Split the observed k interval into this many equally spaced subintervals.
k_intervals = 128
# Gauss-Legendre nodes per k subinterval: 128*4=512 total k nodes here.
k_order = 4
# Positive finite ordered observed-coordinate k limits [h/Mpc], held fixed
# under AP derivatives. These do not define the template's required padded range.
k_min = 0.01
k_max = 0.5
# Gauss-Legendre nodes over mu in [0,1].
mu_order = 32
# Gauss-Legendre nodes per redshift bin for integrated comoving volume.
# This does not integrate bias/signal evolution over the bin.
z_order = 32
# Gauss-Legendre nodes PER magnitude partition interval, not total nodes.
# Actual total depends on raw density/SNR structure and the selected limits.
magnitude_order = 16
# Positive dimensionless AP finite-difference step at fiducial ap=at=1.
# Default centered second-order differences; the generic derivative machinery
# may use a second-order one-sided stencil at a model-domain boundary.
# No convergence criterion on AP derivatives is inferred from this step size.
ap_step = 2.5e-4
# Same tolerance as weighting_rtol above. A valid alternative would replace
# BOTH explicit values with 1e-6, or omit one and set the other to 1e-6.
weight_rtol = 1e-5

# One required [pairs bin N] section per bin, numbered consecutively from 1.
# selected is either literal all (N_fields*(N_fields+1)/2 spectra), or a
# comma-separated list of IDxID pairs. Autos repeat the ID. Pair orientation
# is canonicalized by [fields] order; reversed duplicates are rejected.
# Example alternative for a QSO-only bin: selected = qsoxqso
# The joint Fisher matrix retains the full covariance between selected spectra;
# unselected spectra needed to construct that covariance are still modeled.
# Individual-spectrum constraints use each spectrum's own covariance.
# This DESI prescription excludes every bin-1 pair involving LBG, LAE or
# lya(lbg); bins 2-6 retain all 15. This is a forecast selection, not a plot cut.
[pairs bin 1]
selected = lya(qso)xlya(qso), lya(qso)xqso, qsoxqso

[pairs bin 2]
selected = all

[pairs bin 3]
selected = all

[pairs bin 4]
selected = all

[pairs bin 5]
selected = all

[pairs bin 6]
selected = all
