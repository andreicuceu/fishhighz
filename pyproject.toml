[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishhighz"
version = "0.1.0.dev0"
description = "Fourier-space Fisher forecasts for Lyman-alpha forest and galaxy clustering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "numba"]

[project.optional-dependencies]
templates = ["astropy"]
cosmology = ["astropy"]
camb = ["camb"]
dev = ["pytest", "pytest-cov", "ruff", "build"]
eft = ["eftkernels>=0.1.0"]
docs = ["sphinx>=8,<9", "myst-parser>=4,<5", "sphinx-rtd-theme>=3,<4"]

[project.scripts]
fishhighz-forecast = "fishhighz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fishhighz", "fishhighz.*"]
exclude = ["fishhighz.data", "fishhighz.data.*"]
namespaces = false

[tool.setuptools.package-data]
fishhighz = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fishhighz"]
# Numba-compiled kernels execute as machine code, which coverage.py cannot
# trace; their behaviour is tested through the Python callers.
omit = ["fishhighz/kernels/_compiled_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
